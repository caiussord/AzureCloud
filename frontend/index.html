<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ProductHub | Cadastro de Produtos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div><p class="eyebrow">MVP · Azure Cloud</p><h1>ProductHub</h1></div><span class="pill">Cadastro de Produtos</span></header>
  <main>
    <section class="layout">
      <form id="product-form" class="card">
        <div class="card-title"><h2 id="form-title">Novo produto</h2><button id="cancel" type="button" class="link" hidden>Cancelar edição</button></div>
        <input id="id" type="hidden">
        <label>Nome<input id="name" maxlength="120" required placeholder="Ex.: Teclado sem fio"></label>
        <label>Categoria<input id="category" maxlength="80" required placeholder="Ex.: Periféricos"></label>
        <div class="two-cols"><label>Preço (R$)<input id="price" type="number" min="0" step="0.01" required placeholder="0,00"></label><label>Estoque<input id="stock" type="number" min="0" step="1" required placeholder="0"></label></div>
        <label>Descrição <span>opcional</span><textarea id="description" maxlength="500" placeholder="Descreva brevemente o produto"></textarea></label>
        <button class="primary" type="submit">Salvar produto <span>→</span></button>
      </form>
      <section class="products"><div class="products-head"><div><p class="eyebrow">CATÁLOGO</p><h2>Produtos</h2></div><button id="refresh" class="icon-button" title="Atualizar lista">↻</button></div><p id="status" class="status">Carregando produtos…</p><div id="list" class="product-list"></div></section>
    </section>
  </main>
  <footer>ProductHub · Projeto acadêmico Azure Cloud</footer>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
